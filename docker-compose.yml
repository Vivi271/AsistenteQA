
# ══════════════════════════════════════════════════════════════
# PRQA — Docker Compose
# Asistente QA con IA Local — Ciel Ingeniería S.A.S
#
# Servicios:
#   1. ollama  → Servidor LLM local (llama3.2:3b)
#   2. mysql   → Base de datos MySQL 8
#   3. app     → Backend FastAPI + Frontend estático
#
# Uso:
#   docker-compose up -d
#   Abrir: http://localhost:8000
# ══════════════════════════════════════════════════════════════

services:

  # ── 1. Servidor LLM Local ───────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: prqa_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_FLASH_ATTENTION=1
    restart: unless-stopped

  # ── 2. Base de Datos MySQL 8 ─────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: prqa_mysql
    ports:
      - "3306:3306"
    environment:
      TZ: America/Bogota
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-prqa_root_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-prqa_db}
      MYSQL_USER: ${MYSQL_USER:-prqa_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-prqa_pass_2026}
    volumes:
      - prqa_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-prqa_root_2026}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── 3. Aplicación (API + Frontend estático) ─────────────────
  app:
    build:
      context: .                      # raíz del proyecto
      dockerfile: backend/Dockerfile  # Dockerfile copia backend/ y frontend/
    container_name: prqa_app
    ports:
      - "8000:8000"                   # Abrir http://localhost:8000
    volumes:
      - ./backend/app:/app            # Hot-reload del código Python
      - ./frontend:/app/static        # Hot-reload del frontend
      - ./knowledge_base:/app/knowledge_base
      - prqa_chroma:/app/chroma_db
    environment:
      - TZ=America/Bogota
      - OLLAMA_HOST=http://ollama:11434
      - LLM_MODEL=${LLM_MODEL:-llama3.2:1b}
      - CHROMA_PATH=/app/chroma_db
      - KNOWLEDGE_BASE_PATH=/app/knowledge_base
      - STATIC_PATH=/app/static
      # MySQL connection (PyMySQL driver)
      - DB_URL=mysql+pymysql://${MYSQL_USER:-prqa_user}:${MYSQL_PASSWORD:-prqa_pass_2026}@mysql:3306/${MYSQL_DATABASE:-prqa_db}?charset=utf8mb4
    depends_on:
      mysql:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

# ── Volúmenes persistentes ──────────────────────────────────
volumes:
  ollama_data:       # Modelos LLM descargados
  prqa_mysql_data:   # Base de datos MySQL (casos de prueba, ejecuciones)
  prqa_chroma:       # Base de datos vectorial ChromaDB
